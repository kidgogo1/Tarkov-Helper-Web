            private static string TreeHash(IEnumerable<IsolatedZipRecord> records) {
              StringBuilder text = new StringBuilder();
              foreach (IsolatedZipRecord record in records.OrderBy(item => item.Path, StringComparer.Ordinal)) {
                text.Append(record.Sha256).Append("  ").Append(record.Size.ToString(CultureInfo.InvariantCulture)).Append("  ").Append(record.Path).Append('\n');
              }
              using (SHA256 sha = SHA256.Create()) return Hex(sha.ComputeHash(Encoding.UTF8.GetBytes(text.ToString())));
            }

            private static string DecodeName(byte[] bytes, bool utf8) {
