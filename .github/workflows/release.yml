              }
              if (directory != path.EndsWith("/", StringComparison.Ordinal)) throw new InvalidDataException("ZIP directory marker is invalid");
              string normalized = directory ? path.Substring(0, path.Length - 1) : path;
              if (normalized.Length > 1024) throw new InvalidDataException("ZIP path length limit exceeded");
              foreach (string component in normalized.Split('/')) {
                if (component.Length == 0 || component == "." || component == ".." || component.EndsWith(".", StringComparison.Ordinal) || component.EndsWith(" ", StringComparison.Ordinal)) {
