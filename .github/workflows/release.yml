name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Stable releases are serialized repository-wide so an older build cannot finish
# after a newer one and replace it as the latest release.
concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  CI: "true"
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  quality:
    name: Headless release gates
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      - name: Activate the locked pnpm version
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tag, version, commit, and repository identity
        shell: pwsh
        run: >-
          node scripts/assert-release-version.mjs
          --tag $env:RELEASE_TAG
          --commit $env:RELEASE_COMMIT
          --repository $env:RELEASE_REPOSITORY
          --require-repository

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Weapon modding data contract tests
        run: pnpm test:data

      - name: Release contract tests
        run: pnpm test:release

      - name: Portable package tests
        run: pnpm test:portable

      - name: Headless browser tests
        run: pnpm test:e2e

      - name: Headless direct-release tests
        run: pnpm test:e2e:direct

  package:
    name: Build prepared release archives
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      - name: Activate the locked pnpm version
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the release commit on the protected default branch
        shell: pwsh
        run: |
          git fetch --no-tags origin $env:RELEASE_DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch" }
          git merge-base --is-ancestor $env:RELEASE_COMMIT "refs/remotes/origin/$env:RELEASE_DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not on the repository default branch" }
          node scripts/assert-release-version.mjs --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --require-repository
          if ($LASTEXITCODE -ne 0) { throw "Release identity validation failed" }

      - name: Build static and Direct inputs
        shell: pwsh
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw "Static build failed" }
          $directRoot = Join-Path $env:RUNNER_TEMP "direct-release-input"
          node scripts/create-direct-release.mjs --output $directRoot
          if ($LASTEXITCODE -ne 0) { throw "Direct release creation failed" }

      - name: Create and verify deterministic prepared ZIPs
        shell: pwsh
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY)) {
            throw "UPDATE_SIGNING_PUBLIC_KEY is required"
          }
          $directRoot = Join-Path $env:RUNNER_TEMP "direct-release-input"
          $seedRoot = Join-Path $env:RUNNER_TEMP "release-seed"
          node scripts/create-release-bundle.mjs --direct $directRoot --static dist --output $seedRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --prepare-only
          if ($LASTEXITCODE -ne 0) { throw "Prepared release creation failed" }
          node scripts/verify-release-bundle.mjs --bundle $seedRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --prepared-only
          if ($LASTEXITCODE -ne 0) { throw "Prepared release verification failed" }

      - name: Extract and test the verified prepared Direct ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = $env:RELEASE_TAG.Substring(1)
          $seedRoot = Join-Path $env:RUNNER_TEMP "release-seed"
          $directZip = Join-Path $seedRoot "tarkov-helper-web-direct-v$version.zip"
          if (-not (Test-Path -LiteralPath $directZip -PathType Leaf)) { throw "Prepared Direct ZIP is missing" }
          $extractRoot = Join-Path $env:RUNNER_TEMP "prepared-direct-e2e-$([Guid]::NewGuid().ToString('N'))"
          [IO.Directory]::CreateDirectory($extractRoot) | Out-Null
          [IO.Compression.ZipFile]::ExtractToDirectory($directZip, $extractRoot)
          $directRoot = Join-Path $extractRoot "Tarkov Helper 바로 실행 v$version"
          $rootEntries = @(Get-ChildItem -LiteralPath $extractRoot -Force)
          if (
            $rootEntries.Count -ne 1 -or -not (Test-Path -LiteralPath $directRoot -PathType Container) -or
            -not [string]::Equals($rootEntries[0].FullName, $directRoot, [StringComparison]::Ordinal)
          ) { throw "Prepared Direct ZIP did not extract to the exact release root" }
          $port = 0
          for ($attempt = 1; $attempt -le 10; $attempt += 1) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            try {
              $listener.Start()
              $candidatePort = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
            } finally {
              $listener.Stop()
            }
            $connections = & (Join-Path $env:SystemRoot "System32\netstat.exe") -ano -p tcp
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect Direct E2E port availability" }
            $listeningPattern = "^\s*TCP\s+\S+:$candidatePort\s+\S+\s+LISTENING\s+\d+\s*$"
            if (-not ($connections | Select-String -Pattern $listeningPattern)) {
              $port = $candidatePort
              break
            }
          }
          if ($port -lt 1 -or $port -gt 65535) { throw "Unable to reserve a Direct E2E port" }
          $env:TARKOV_HELPER_DIRECT_ROOT = $directRoot
          $env:TARKOV_HELPER_E2E_PORT = [string]$port
          pnpm test:e2e:direct
          if ($LASTEXITCODE -ne 0) { throw "Prepared Direct ZIP browser E2E failed" }

      - name: Transfer only prepared ZIPs to the protected publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-seed-${{ github.sha }}
          path: ${{ runner.temp }}/release-seed/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  finalize:
    name: Bind unsigned manifest to verified draft
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the tagged revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js without installing project dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Download prepared ZIPs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-seed-${{ github.sha }}
          path: ${{ runner.temp }}/release-seed

      - name: Revalidate trusted branch, tag, and prepared archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY)) {
            throw "UPDATE_SIGNING_PUBLIC_KEY is required"
          }
          git fetch --no-tags origin $env:RELEASE_DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch" }
          git merge-base --is-ancestor $env:RELEASE_COMMIT "refs/remotes/origin/$env:RELEASE_DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not on the repository default branch" }
          $tagCommit = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not [string]::Equals($tagCommit.Trim(), $env:RELEASE_COMMIT, [System.StringComparison]::Ordinal)) {
            throw "Remote tag no longer resolves to the workflow commit"
          }
          node scripts/assert-release-version.mjs --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --require-repository
          if ($LASTEXITCODE -ne 0) { throw "Release identity validation failed" }
          $seedRoot = Join-Path $env:RUNNER_TEMP "release-seed"
          node scripts/verify-release-bundle.mjs --bundle $seedRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --prepared-only
          if ($LASTEXITCODE -ne 0) { throw "Prepared release verification failed on the protected runner" }

      - name: Create or safely reuse the verified draft
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $seedRoot = Join-Path $env:RUNNER_TEMP "release-seed"
          $zipAssets = @(Get-ChildItem -LiteralPath $seedRoot -File -Filter "*.zip" | Sort-Object Name)
          if ($zipAssets.Count -ne 3) { throw "Expected exactly three ZIP seed assets" }
          $version = $env:RELEASE_TAG.Substring(1)
          $allowedNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          @(
            "tarkov-helper-web-direct-v$version.zip",
            "tarkov-helper-web-static-v$version.zip",
            "tarkov-helper-web-source-v$version.zip",
            "update-manifest-v1.json",
            "update-manifest-v1.sig",
            "SHA256SUMS.txt"
          ) | ForEach-Object { [void]$allowedNames.Add($_) }
          function Get-ExactAsset([object]$release, [string]$name) {
            return @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
          }
          function Read-Draft([int64]$releaseId) {
            $json = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId"
            if ($LASTEXITCODE -ne 0) { throw "Unable to read the draft release" }
            $value = $json | ConvertFrom-Json
            if (
              [int64]$value.id -ne $releaseId -or -not $value.draft -or $value.prerelease -or
              -not [string]::Equals([string]$value.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
            ) {
              throw "An existing release cannot be safely resumed"
            }
            return $value
          }
          function Find-Draft() {
            $json = gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp "repos/$env:RELEASE_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "Unable to list draft releases" }
            $pages = $json | ConvertFrom-Json
            $matches = @(
              foreach ($page in @($pages)) {
                foreach ($candidate in @($page)) {
                  if ([string]::Equals([string]$candidate.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)) {
                    $candidate
                  }
                }
              }
            )
            if ($matches.Count -gt 1) { throw "Multiple releases use the requested tag" }
            if ($matches.Count -eq 0) { return $null }
            if (-not $matches[0].draft -or $matches[0].prerelease) { throw "An existing release cannot be safely resumed" }
            return $matches[0]
          }
          function Upload-Asset([System.IO.FileInfo]$file) {
            gh release upload $env:RELEASE_TAG $file.FullName --repo $env:RELEASE_REPOSITORY | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $($file.Name)" }
          }
          $recoveryNotes = @'
          ### 업데이트 복구 안내

          v1.0.2 이하 버전을 사용 중이거나 업데이트가 반복해서 실패하면, 기존 Tarkov Helper를 먼저 종료하고 기존 폴더에 덮어쓰지 말고 최신 Direct ZIP을 새 짧은 폴더에 압축을 풀어 `Tarkov Helper.exe`를 실행하세요.

          새 폴더도 공유 상태 오류 때문에 시작하지 못하고 `Tarkov Helper 상태 복구.cmd`가 거부하면 기존 앱과 41753 포트를 완전히 종료한 뒤 새 폴더의 `Tarkov Helper 격리 복구 실행.cmd`를 사용하세요. 일반 상태는 보존되며, 종료할 때는 같은 파일을 `stop` 인수와 함께 실행합니다.
          '@
          $release = Find-Draft
          if ($null -eq $release) {
            gh release create $env:RELEASE_TAG ($zipAssets | ForEach-Object FullName) --draft --generate-notes --notes $recoveryNotes --title "Tarkov Helper $env:RELEASE_TAG" --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed" }
            for ($attempt = 1; $attempt -le 6; $attempt += 1) {
              $release = Find-Draft
              if ($null -ne $release) { break }
              if ($attempt -eq 6) { throw "Created draft release was not visible within the bounded wait" }
              Start-Sleep -Seconds 2
            }
          }
          $releaseId = [int64]$release.id
          if ($releaseId -le 0 -or $releaseId -gt 9007199254740991) { throw "Draft release ID is invalid" }
          $release = Read-Draft $releaseId
          $unexpected = @($release.assets | Where-Object { -not $allowedNames.Contains([string]$_.name) })
          if ($unexpected.Count -ne 0) { throw "Existing draft contains unexpected or case-mismatched assets" }
          foreach ($zip in $zipAssets) {
            $matches = @(Get-ExactAsset $release $zip.Name)
            if ($matches.Count -gt 1) { throw "Duplicate draft ZIP asset: $($zip.Name)" }
            if ($matches.Count -eq 0) {
              Upload-Asset $zip
            }
          }
          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            $release = Read-Draft $releaseId
            $ready = $true
            foreach ($zip in $zipAssets) {
              $matches = @(Get-ExactAsset $release $zip.Name)
              if ($matches.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$matches[0].digest)) { $ready = $false; break }
            }
            if ($ready) { break }
            if ($attempt -eq 6) { throw "GitHub did not report ZIP asset digests within the bounded wait" }
            Start-Sleep -Seconds 2
          }
          foreach ($zip in $zipAssets) {
            $matches = @(Get-ExactAsset $release $zip.Name)
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$matches[0].size -ne $zip.Length -or -not [string]::Equals([string]$matches[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Existing draft ZIP does not match the deterministic seed: $($zip.Name)"
            }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "release_id=$releaseId"

      - name: Finalize unsigned metadata bound to GitHub IDs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $seedRoot = Join-Path $env:RUNNER_TEMP "release-seed"
          $bundleRoot = Join-Path $env:RUNNER_TEMP "release-assets-unsigned"
          $releaseId = [int64]$env:RELEASE_ID
          if ($releaseId -le 0 -or $releaseId -gt 9007199254740991) { throw "Draft release ID is invalid" }
          $release = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 -or [int64]$release.id -ne $releaseId -or -not $release.draft -or $release.prerelease -or
            -not [string]::Equals([string]$release.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
          ) { throw "Unable to resolve the draft release" }
          function Get-AssetId([string]$name) {
            $matches = @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
            if ($matches.Count -ne 1) { throw "Draft asset identity mismatch for $name" }
            return [int64]$matches[0].id
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $directId = Get-AssetId "tarkov-helper-web-direct-v$version.zip"
          $staticId = Get-AssetId "tarkov-helper-web-static-v$version.zip"
          $sourceId = Get-AssetId "tarkov-helper-web-source-v$version.zip"
          node scripts/create-release-bundle.mjs --prepared $seedRoot --finalize-unsigned --output $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $release.id --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId
          if ($LASTEXITCODE -ne 0) { throw "Unsigned release manifest finalization failed" }
          node scripts/verify-release-bundle.mjs --bundle $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $release.id --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId --unsigned-finalized
          if ($LASTEXITCODE -ne 0) { throw "Unsigned release manifest verification failed" }
          foreach ($zip in Get-ChildItem -LiteralPath $bundleRoot -File -Filter "*.zip") {
            $seed = Join-Path $seedRoot $zip.Name
            if (-not (Test-Path -LiteralPath $seed -PathType Leaf)) { throw "Seed ZIP missing: $($zip.Name)" }
            if ((Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $seed -Algorithm SHA256).Hash) {
              throw "ZIP changed after GitHub asset ID assignment: $($zip.Name)"
            }
          }

      - name: Transfer unsigned release assets to the isolated signer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets-unsigned/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  sign:
    name: Validate and sign on an isolated runner
    needs: finalize
    runs-on: windows-2025
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: read
    steps:
      - name: Download only the unsigned finalized assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Require immutable releases before signing
        shell: pwsh
        env:
          IMMUTABLE_SETTINGS_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:IMMUTABLE_SETTINGS_TOKEN)) {
            throw "IMMUTABLE_RELEASES_READ_TOKEN is required with repository Administration (read) permission"
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $($env:IMMUTABLE_SETTINGS_TOKEN)"
            "X-GitHub-Api-Version" = "2026-03-10"
          }
          $uri = "https://api.github.com/repos/$($env:RELEASE_REPOSITORY)/immutable-releases"
          $settings = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -MaximumRedirection 0
          if ($settings.enabled -ne $true) { throw "Immutable releases must be enabled before signing" }

      - name: Independently validate and sign the raw manifest
        shell: pwsh
        env:
          SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Stable release tag is invalid" }
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "Release commit must be a full lowercase SHA-1" }
          if ($env:RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}$') { throw "Repository identity is invalid" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_PEM)) { throw "The update signing private key is required" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY)) { throw "The update signing public key is required" }
          if (-not ("System.IO.Compression.ZipFile" -as [type])) { Add-Type -AssemblyName System.IO.Compression.FileSystem }

          $version = $env:RELEASE_TAG.Substring(1)
          $assetRoot = Join-Path $env:RUNNER_TEMP "release-assets"
          $manifestName = "update-manifest-v1.json"
          $signatureName = "update-manifest-v1.sig"
          $directName = "tarkov-helper-web-direct-v$version.zip"
          $staticName = "tarkov-helper-web-static-v$version.zip"
          $sourceName = "tarkov-helper-web-source-v$version.zip"
          $unsignedNames = [string[]]@($directName, $staticName, $sourceName, $manifestName)
          [Array]::Sort($unsignedNames, [StringComparer]::Ordinal)
          $entries = @(Get-ChildItem -LiteralPath $assetRoot -Force)
          if ($entries.Count -ne $unsignedNames.Count) { throw "Unsigned artifact file set mismatch" }
          $actualNames = [string[]]@($entries | ForEach-Object { $_.Name })
          [Array]::Sort($actualNames, [StringComparer]::Ordinal)
          if (-not [string]::Equals([string]::Join("`0", $actualNames), [string]::Join("`0", $unsignedNames), [StringComparison]::Ordinal)) {
            throw "Unsigned artifact names do not match the release contract"
          }
          foreach ($entry in $entries) {
            if (-not ($entry -is [IO.FileInfo]) -or (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
              throw "Unsigned artifact contains a non-regular file"
            }
          }

          $zipValidatorSource = @'
          using System;
          using System.Collections.Generic;
          using System.Globalization;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.RegularExpressions;

          public sealed class IsolatedZipRecord {
            public string Path { get; set; }
            public long Size { get; set; }
            public string Sha256 { get; set; }
          }

          public sealed class IsolatedZipReport {
            public long FileCount { get; set; }
            public long Bytes { get; set; }
            public string TreeSha256 { get; set; }
            public long AppFileCount { get; set; }
            public long AppBytes { get; set; }
            public string AppTreeSha256 { get; set; }
            public string Comment { get; set; }
            public Dictionary<string, byte[]> Captured { get; set; }
          }

          public static class IsolatedZipValidator {
            private const long MaxArchiveBytes = 128L * 1024 * 1024;
            private const long MaxEntryBytes = 128L * 1024 * 1024;
            private const long MaxTotalBytes = 256L * 1024 * 1024;
            private const int MaxEntries = 10000;
            private const double MaxCompressionRatio = 200.0;
            private const int MaxCapturedBytes = 4 * 1024 * 1024;
            private static readonly UTF8Encoding StrictUtf8 = new UTF8Encoding(false, true);
            private static readonly Regex ReservedName = new Regex(
              @"^(?:con|prn|aux|nul|com[1-9\u00b9\u00b2\u00b3]|lpt[1-9\u00b9\u00b2\u00b3])(?:\.|$)",
              RegexOptions.IgnoreCase | RegexOptions.CultureInvariant
            );
            private static readonly uint[] CrcTable = CreateCrcTable();
            private static readonly string[] RequiredDirectPaths = new string[] {
              "launcher.ps1",
              "app-update-worker.ps1",
              "app-update-broker.ps1",
              "TarkovHelper.ico",
              "Tarkov Helper.exe",
              "start-menu.ps1",
              "Tarkov Helper 실행.vbs",
              "Tarkov Helper 시작 메뉴 등록.vbs",
              "Tarkov Helper 시작 메뉴 제거.vbs",
              "Tarkov Helper 종료.vbs",
              "문제 해결용 실행.cmd",
              "Tarkov Helper 상태 복구.cmd",
              "Tarkov Helper 격리 복구 실행.cmd",
              "사용 안내.txt",
              "UPDATE_CONFIG.json",
              "PACKAGE_INFO.txt",
              "SHA256SUMS.txt",
              "app/index.html",
              "app/version.json"
            };

            private sealed class CentralEntry {
              public ushort VersionNeeded;
              public ushort Flags;
              public ushort Method;
              public uint Crc;
              public long CompressedSize;
              public long Size;
              public string Name;
              public byte[] NameBytes;
              public bool Directory;
              public long LocalOffset;
              public string Relative;
            }

            private sealed class PathNode {
              public string Original;
              public bool File;
            }

            private sealed class LauncherSection {
              public uint VirtualAddress;
              public uint VirtualSize;
              public uint RawOffset;
              public uint RawSize;
            }

            public static IsolatedZipReport Validate(string filename, string rootDirectory, string[] capturedNames, bool strictDirect) {
              if (String.IsNullOrEmpty(rootDirectory) || rootDirectory.IndexOf('/') >= 0 || rootDirectory.IndexOf('\\') >= 0) {
                throw new InvalidDataException("ZIP root directory is invalid");
              }
              HashSet<string> captures = new HashSet<string>(capturedNames ?? new string[0], StringComparer.Ordinal);
              using (FileStream stream = new FileStream(filename, FileMode.Open, FileAccess.Read, FileShare.Read)) {
                if (stream.Length < 22 || stream.Length > MaxArchiveBytes) throw new InvalidDataException("ZIP archive size limit exceeded");
                long eocdOffset;
                byte[] commentBytes;
                long centralOffset;
                long centralSize;
                int entryCount;
                ReadEnd(stream, out eocdOffset, out centralOffset, out centralSize, out entryCount, out commentBytes);
                if (strictDirect && (entryCount == 0 || commentBytes.Length != 0)) throw new InvalidDataException("Direct ZIP entry count or archive comment mismatch");
                List<CentralEntry> metadata = ReadCentral(stream, eocdOffset, centralOffset, centralSize, entryCount, rootDirectory, strictDirect);
                ValidateCollisions(metadata);
                ValidateLocalLayout(stream, centralOffset, metadata, strictDirect);
                string comment = StrictUtf8.GetString(commentBytes);

                Dictionary<string, IsolatedZipRecord> files = new Dictionary<string, IsolatedZipRecord>(StringComparer.Ordinal);
                Dictionary<string, byte[]> captured = new Dictionary<string, byte[]>(StringComparer.Ordinal);
                long actualTotal = 0;
                stream.Position = 0;
                using (ZipArchive archive = new ZipArchive(stream, ZipArchiveMode.Read, true)) {
                  if (archive.Entries.Count != metadata.Count) throw new InvalidDataException("ZIP entry count changed after preflight");
                  Dictionary<string, ZipArchiveEntry> archiveEntries = new Dictionary<string, ZipArchiveEntry>(StringComparer.Ordinal);
                  foreach (ZipArchiveEntry item in archive.Entries) {
                    if (archiveEntries.ContainsKey(item.FullName)) throw new InvalidDataException("Duplicate ZIP entry name");
                    archiveEntries.Add(item.FullName, item);
                  }
                  foreach (CentralEntry item in metadata) {
                    ZipArchiveEntry archiveEntry;
                    if (!archiveEntries.TryGetValue(item.Name, out archiveEntry)) throw new InvalidDataException("ZIP entry disappeared after preflight");
                    if (archiveEntry.Length != item.Size || archiveEntry.CompressedLength != item.CompressedSize) {
                      throw new InvalidDataException("ZIP entry sizes changed after preflight");
                    }
                    if (item.Directory) continue;
                    long actualSize = 0;
                    uint crc = 0xffffffffU;
                    byte[] digest;
                    MemoryStream capture = captures.Contains(item.Relative) ? new MemoryStream() : null;
                    try {
                      using (SHA256 sha = SHA256.Create()) {
                        using (CryptoStream hashing = new CryptoStream(Stream.Null, sha, CryptoStreamMode.Write)) {
                          using (Stream input = archiveEntry.Open()) {
                            byte[] buffer = new byte[1024 * 1024];
                            while (true) {
                              int read = input.Read(buffer, 0, buffer.Length);
                              if (read == 0) break;
                              actualSize = checked(actualSize + read);
                              actualTotal = checked(actualTotal + read);
                              if (actualSize > item.Size || actualSize > MaxEntryBytes || actualTotal > MaxTotalBytes) {
                                throw new InvalidDataException("ZIP inflation size limit exceeded");
                              }
                              hashing.Write(buffer, 0, read);
                              crc = UpdateCrc(crc, buffer, read);
                              if (capture != null) {
                                if (capture.Length + read > MaxCapturedBytes) throw new InvalidDataException("Captured ZIP metadata size limit exceeded");
                                capture.Write(buffer, 0, read);
                              }
                            }
                          }
                          hashing.FlushFinalBlock();
                          digest = (byte[])sha.Hash.Clone();
                        }
                      }
                      if (actualSize != item.Size || (crc ^ 0xffffffffU) != item.Crc) throw new InvalidDataException("ZIP CRC-32 or length mismatch");
                      IsolatedZipRecord record = new IsolatedZipRecord {
                        Path = item.Relative,
                        Size = actualSize,
                        Sha256 = Hex(digest)
                      };
                      files.Add(record.Path, record);
                      if (capture != null) captured.Add(record.Path, capture.ToArray());
                    } finally {
                      if (capture != null) capture.Dispose();
                    }
                  }
                }

                foreach (string requested in captures) {
                  if (!captured.ContainsKey(requested)) throw new InvalidDataException("Required ZIP metadata entry is missing: " + requested);
                }
                if (strictDirect) {
                  foreach (string required in RequiredDirectPaths) {
                    if (!files.ContainsKey(required)) throw new InvalidDataException("Required Direct ZIP entry is missing: " + required);
                  }
                }
                if (captured.ContainsKey("SHA256SUMS.txt")) ValidateInternalChecksums(captured["SHA256SUMS.txt"], files);
                List<IsolatedZipRecord> all = files.Values.ToList();
                long allBytes = all.Sum(record => record.Size);
                if (all.Count < 1 || all.Count > MaxEntries || allBytes < 1 || allBytes > MaxTotalBytes) {
                  throw new InvalidDataException("ZIP report exceeds client unpacked bounds");
                }
                List<IsolatedZipRecord> app = files.Values
                  .Where(record => record.Path.StartsWith("app/", StringComparison.Ordinal))
                  .Select(record => new IsolatedZipRecord { Path = record.Path.Substring(4), Size = record.Size, Sha256 = record.Sha256 })
                  .ToList();
                return new IsolatedZipReport {
                  FileCount = all.Count,
                  Bytes = allBytes,
                  TreeSha256 = TreeHash(all),
                  AppFileCount = app.Count,
                  AppBytes = app.Sum(record => record.Size),
                  AppTreeSha256 = TreeHash(app),
                  Comment = comment,
                  Captured = captured
                };
              }
            }

            public static void ValidateLauncher(byte[] contents, string expectedVersion) {
              if (contents == null) throw new InvalidDataException("Launcher PE contents are missing");
              if (String.IsNullOrEmpty(expectedVersion) || !Regex.IsMatch(expectedVersion, @"^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$", RegexOptions.CultureInvariant)) {
                throw new InvalidDataException("Launcher expected version is invalid");
              }
              RequireLauncherRange(contents, 0, 64, "DOS header");
              if (contents[0] != (byte)'M' || contents[1] != (byte)'Z') throw new InvalidDataException("Launcher is missing the MZ header");

              int peOffset = LauncherOffset(ReadLauncherUInt32(contents, 0x3c, "PE offset"), "PE offset");
              RequireLauncherRange(contents, peOffset, 24, "PE header");
              if (
                contents[peOffset] != (byte)'P' ||
                contents[peOffset + 1] != (byte)'E' ||
                contents[peOffset + 2] != 0 ||
                contents[peOffset + 3] != 0
              ) throw new InvalidDataException("Launcher is missing the PE signature");

              int coffOffset = checked(peOffset + 4);
              int sectionCount = ReadLauncherUInt16(contents, coffOffset + 2, "section count");
              int optionalHeaderSize = ReadLauncherUInt16(contents, coffOffset + 16, "optional header size");
              ushort characteristics = ReadLauncherUInt16(contents, coffOffset + 18, "characteristics");
              if ((characteristics & 0x0002) == 0) throw new InvalidDataException("Launcher PE is not marked executable");
              if (sectionCount < 1) throw new InvalidDataException("Launcher PE has no sections");

              int optionalOffset = checked(coffOffset + 20);
              RequireLauncherRange(contents, optionalOffset, optionalHeaderSize, "optional header");
              if (optionalHeaderSize < 120 || ReadLauncherUInt16(contents, optionalOffset, "optional header magic") != 0x10b) {
                throw new InvalidDataException("Launcher must be a PE32 image");
              }
              if (ReadLauncherUInt16(contents, optionalOffset + 68, "subsystem") != 2) {
                throw new InvalidDataException("Launcher must use the Windows GUI subsystem");
              }
              if (ReadLauncherUInt32(contents, optionalOffset + 92, "data directory count") < 3) {
                throw new InvalidDataException("Launcher PE has no resource data directory");
              }

              uint resourceRva = ReadLauncherUInt32(contents, optionalOffset + 112, "resource RVA");
              uint resourceSize = ReadLauncherUInt32(contents, optionalOffset + 116, "resource size");
              if (resourceRva == 0 || resourceSize == 0) throw new InvalidDataException("Launcher has no PE resource directory");
              int sectionTableOffset = checked(optionalOffset + optionalHeaderSize);
              RequireLauncherRange(contents, sectionTableOffset, checked((long)sectionCount * 40L), "section table");
              LauncherSection[] sections = new LauncherSection[sectionCount];
              for (int index = 0; index < sectionCount; index += 1) {
                int sectionOffset = checked(sectionTableOffset + (index * 40));
                sections[index] = new LauncherSection {
                  VirtualSize = ReadLauncherUInt32(contents, sectionOffset + 8, "section virtual size"),
                  VirtualAddress = ReadLauncherUInt32(contents, sectionOffset + 12, "section virtual address"),
                  RawSize = ReadLauncherUInt32(contents, sectionOffset + 16, "section raw size"),
                  RawOffset = ReadLauncherUInt32(contents, sectionOffset + 20, "section raw offset")
                };
              }

              int resourceOffset = MapLauncherRva(contents, sections, resourceRva, "resource directory");
              RequireLauncherRange(contents, resourceOffset, resourceSize, "resource directory");
              FindLauncherResourceType(contents, resourceOffset, resourceSize, 3, "RT_ICON");
              FindLauncherResourceType(contents, resourceOffset, resourceSize, 14, "RT_GROUP_ICON");
              uint versionTarget = FindLauncherResourceType(contents, resourceOffset, resourceSize, 16, "RT_VERSION");
              uint manifestTarget = FindLauncherResourceType(contents, resourceOffset, resourceSize, 24, "RT_MANIFEST");

              byte[] versionResource = ReadLauncherResource(contents, sections, resourceOffset, resourceSize, versionTarget, "RT_VERSION");
              string[] versions = LauncherFixedVersions(versionResource);
              string normalizedVersion = expectedVersion + ".0";
              if (!String.Equals(versions[0], normalizedVersion, StringComparison.Ordinal) || !String.Equals(versions[1], normalizedVersion, StringComparison.Ordinal)) {
                throw new InvalidDataException("Launcher version mismatch: expected " + normalizedVersion + ", received " + versions[0] + "/" + versions[1]);
              }

              byte[] manifestResource = ReadLauncherResource(contents, sections, resourceOffset, resourceSize, manifestTarget, "RT_MANIFEST");
              string manifest;
              try {
                manifest = StrictUtf8.GetString(manifestResource);
              } catch (DecoderFallbackException) {
                throw new InvalidDataException("Launcher RT_MANIFEST is not valid UTF-8");
              }
              if (manifest.Length > 0 && manifest[0] == '\ufeff') manifest = manifest.Substring(1);
              MatchCollection requestedLevels = Regex.Matches(manifest, @"<requestedExecutionLevel\b[^>]*>", RegexOptions.CultureInvariant);
              bool validExecutionLevel = requestedLevels.Count == 1 &&
                Regex.IsMatch(requestedLevels[0].Value, @"\blevel\s*=\s*[""']asInvoker[""']", RegexOptions.CultureInvariant) &&
                Regex.IsMatch(requestedLevels[0].Value, @"\buiAccess\s*=\s*[""']false[""']", RegexOptions.CultureInvariant);
              if (!validExecutionLevel) throw new InvalidDataException("Launcher manifest must request asInvoker with uiAccess=false");
            }

            private static void RequireLauncherRange(byte[] contents, long offset, long length, string label) {
              if (offset < 0 || length < 0 || offset > contents.LongLength - length) {
                throw new InvalidDataException("Launcher PE " + label + " exceeds file bounds");
              }
            }

            private static int LauncherOffset(uint value, string label) {
              if (value > Int32.MaxValue) throw new InvalidDataException("Launcher PE " + label + " exceeds supported bounds");
              return (int)value;
            }

            private static ushort ReadLauncherUInt16(byte[] contents, int offset, string label) {
              RequireLauncherRange(contents, offset, 2, label);
              return (ushort)((uint)contents[offset] | ((uint)contents[offset + 1] << 8));
            }

            private static uint ReadLauncherUInt32(byte[] contents, int offset, string label) {
              RequireLauncherRange(contents, offset, 4, label);
              return (uint)contents[offset] |
                ((uint)contents[offset + 1] << 8) |
                ((uint)contents[offset + 2] << 16) |
                ((uint)contents[offset + 3] << 24);
            }

            private static int MapLauncherRva(byte[] contents, LauncherSection[] sections, uint rva, string label) {
              ulong target = rva;
              foreach (LauncherSection section in sections) {
                ulong start = section.VirtualAddress;
                ulong span = Math.Max((ulong)section.VirtualSize, (ulong)section.RawSize);
                if (target < start || target >= start + span) continue;
                ulong mapped = (ulong)section.RawOffset + (target - start);
                if (mapped > Int32.MaxValue) throw new InvalidDataException("Launcher PE " + label + " exceeds supported bounds");
                RequireLauncherRange(contents, (long)mapped, 1, label);
                return (int)mapped;
              }
              throw new InvalidDataException("Launcher PE " + label + " RVA is not mapped by a section");
            }

            private static int LauncherResourceOffset(byte[] contents, int resourceOffset, uint resourceSize, uint relativeOffset, long length, string label) {
              if ((ulong)relativeOffset + (ulong)length > (ulong)resourceSize) {
                throw new InvalidDataException("Launcher " + label + " exceeds the resource directory bounds");
              }
              long absolute = checked((long)resourceOffset + (long)relativeOffset);
              RequireLauncherRange(contents, absolute, length, label);
              if (absolute > Int32.MaxValue) throw new InvalidDataException("Launcher " + label + " exceeds supported bounds");
              return (int)absolute;
            }

            private static uint FindLauncherResourceType(byte[] contents, int resourceOffset, uint resourceSize, uint typeId, string label) {
              int root = LauncherResourceOffset(contents, resourceOffset, resourceSize, 0, 16, "resource root");
              int count = checked(
                (int)ReadLauncherUInt16(contents, root + 12, "resource named count") +
                (int)ReadLauncherUInt16(contents, root + 14, "resource ID count")
              );
              int entries = LauncherResourceOffset(contents, resourceOffset, resourceSize, 16, checked((long)count * 8L), "resource root entries");
              for (int index = 0; index < count; index += 1) {
                int entry = checked(entries + (index * 8));
                uint nameOrId = ReadLauncherUInt32(contents, entry, label + " name");
                if ((nameOrId & 0x80000000U) != 0 || nameOrId != typeId) continue;
                uint target = ReadLauncherUInt32(contents, entry + 4, label + " target");
                if ((target & 0x80000000U) == 0) throw new InvalidDataException("Launcher " + label + " is not a resource directory");
                return target;
              }
              throw new InvalidDataException("Launcher is missing " + label);
            }

            private static byte[] ReadLauncherResource(
              byte[] contents,
              LauncherSection[] sections,
              int resourceOffset,
              uint resourceSize,
              uint rootTarget,
              string label
            ) {
              uint target = rootTarget;
              for (int depth = 0; depth < 2; depth += 1) {
                if ((target & 0x80000000U) == 0) throw new InvalidDataException("Launcher " + label + " resource level is not a directory");
                uint relative = target & 0x7fffffffU;
                int directory = LauncherResourceOffset(contents, resourceOffset, resourceSize, relative, 16, label + " directory");
                int count = checked(
                  (int)ReadLauncherUInt16(contents, directory + 12, label + " named count") +
                  (int)ReadLauncherUInt16(contents, directory + 14, label + " ID count")
                );
                if (count < 1) throw new InvalidDataException("Launcher " + label + " resource directory is empty");
                int firstEntry = LauncherResourceOffset(contents, resourceOffset, resourceSize, checked(relative + 16U), checked((long)count * 8L), label + " entries");
                target = ReadLauncherUInt32(contents, firstEntry + 4, label + " entry target");
              }
              if ((target & 0x80000000U) != 0) throw new InvalidDataException("Launcher " + label + " language entry is not resource data");
              int dataEntry = LauncherResourceOffset(contents, resourceOffset, resourceSize, target, 16, label + " data entry");
              uint dataRva = ReadLauncherUInt32(contents, dataEntry, label + " data RVA");
              uint dataSize = ReadLauncherUInt32(contents, dataEntry + 4, label + " data size");
              if (dataSize == 0 || dataSize > Int32.MaxValue) throw new InvalidDataException("Launcher " + label + " data size is invalid");
              int dataOffset = MapLauncherRva(contents, sections, dataRva, label + " data");
              RequireLauncherRange(contents, dataOffset, dataSize, label + " data");
              byte[] result = new byte[(int)dataSize];
              Buffer.BlockCopy(contents, dataOffset, result, 0, result.Length);
              return result;
            }

            private static string[] LauncherFixedVersions(byte[] resource) {
              int offset = -1;
              for (int index = 0; index <= resource.Length - 24; index += 1) {
                if (ReadLauncherUInt32(resource, index, "RT_VERSION fixed information") == 0xfeef04bdU) {
                  offset = index;
                  break;
                }
              }
              if (offset < 0) throw new InvalidDataException("Launcher RT_VERSION is missing VS_FIXEDFILEINFO");
              return new string[] {
                DottedLauncherVersion(
                  ReadLauncherUInt32(resource, offset + 8, "file version MS"),
                  ReadLauncherUInt32(resource, offset + 12, "file version LS")
                ),
                DottedLauncherVersion(
                  ReadLauncherUInt32(resource, offset + 16, "product version MS"),
                  ReadLauncherUInt32(resource, offset + 20, "product version LS")
                )
              };
            }

            private static string DottedLauncherVersion(uint most, uint least) {
              return String.Join(".", new string[] {
                (most >> 16).ToString(CultureInfo.InvariantCulture),
                (most & 0xffffU).ToString(CultureInfo.InvariantCulture),
                (least >> 16).ToString(CultureInfo.InvariantCulture),
                (least & 0xffffU).ToString(CultureInfo.InvariantCulture)
              });
            }

            private static void ReadEnd(
              FileStream stream,
              out long eocdOffset,
              out long centralOffset,
              out long centralSize,
              out int entryCount,
              out byte[] comment
            ) {
              int tailLength = (int)Math.Min(stream.Length, 65557L);
              byte[] tail = new byte[tailLength];
              stream.Position = stream.Length - tailLength;
              ReadFully(stream, tail, 0, tail.Length);
              int found = -1;
              for (int index = tail.Length - 22; index >= 0; index -= 1) {
                if (ReadUInt32(tail, index) != 0x06054b50U) continue;
                int commentLength = ReadUInt16(tail, index + 20);
                if (index + 22 + commentLength == tail.Length) { found = index; break; }
              }
              if (found < 0) throw new InvalidDataException("ZIP end-of-central-directory record is missing or has trailing data");
              if (ReadUInt16(tail, found + 4) != 0 || ReadUInt16(tail, found + 6) != 0) throw new InvalidDataException("Multi-disk ZIP is not supported");
              int diskEntries = ReadUInt16(tail, found + 8);
              entryCount = ReadUInt16(tail, found + 10);
              if (entryCount == 65535 || diskEntries != entryCount || entryCount > MaxEntries) throw new InvalidDataException("ZIP64 or excessive entry count is not supported");
              centralSize = ReadUInt32(tail, found + 12);
              centralOffset = ReadUInt32(tail, found + 16);
              eocdOffset = stream.Length - tailLength + found;
              if (centralOffset < 0 || centralSize < 0 || centralOffset + centralSize != eocdOffset) {
                throw new InvalidDataException("ZIP central directory layout is invalid");
              }
              int length = ReadUInt16(tail, found + 20);
              comment = new byte[length];
              Buffer.BlockCopy(tail, found + 22, comment, 0, length);
            }

            private static List<CentralEntry> ReadCentral(
              FileStream stream,
              long eocdOffset,
              long centralOffset,
              long centralSize,
              int entryCount,
              string rootDirectory,
              bool strictDirect
            ) {
              List<CentralEntry> result = new List<CentralEntry>(entryCount);
              long declaredTotal = 0;
              stream.Position = centralOffset;
              using (BinaryReader reader = new BinaryReader(stream, Encoding.UTF8, true)) {
                for (int index = 0; index < entryCount; index += 1) {
                  if (reader.ReadUInt32() != 0x02014b50U) throw new InvalidDataException("ZIP central entry signature is invalid");
                  ushort versionMadeBy = reader.ReadUInt16();
                  ushort versionNeeded = reader.ReadUInt16();
                  ushort flags = reader.ReadUInt16();
                  ushort method = reader.ReadUInt16();
                  reader.ReadUInt16(); reader.ReadUInt16();
                  uint crc = reader.ReadUInt32();
                  long compressedSize = reader.ReadUInt32();
                  long size = reader.ReadUInt32();
                  int nameLength = reader.ReadUInt16();
                  int extraLength = reader.ReadUInt16();
                  int entryCommentLength = reader.ReadUInt16();
                  ushort diskStart = reader.ReadUInt16();
                  reader.ReadUInt16();
                  uint externalAttributes = reader.ReadUInt32();
                  long localOffset = reader.ReadUInt32();
                  if (versionNeeded > 20 || diskStart != 0) throw new InvalidDataException("ZIP64 or unsupported ZIP version is not allowed");
                  if ((flags & 0x0001) != 0 || (flags & 0x0008) != 0 || (flags & ~0x0800) != 0) throw new InvalidDataException("Unsupported ZIP entry flags");
                  if (method != 0 && method != 8) throw new InvalidDataException("Unsupported ZIP compression method");
                  if (nameLength == 0 || entryCommentLength != 0) throw new InvalidDataException("ZIP entry name or comment is invalid");
                  if (strictDirect && (flags != 0x0800 || extraLength != 0 || entryCommentLength != 0 || nameLength > 1024)) {
                    throw new InvalidDataException("Direct ZIP flags, extra fields, comments, or path length do not match the worker contract");
                  }
                  byte[] nameBytes = reader.ReadBytes(nameLength);
                  if (nameBytes.Length != nameLength) throw new EndOfStreamException();
                  byte[] extra = reader.ReadBytes(extraLength);
                  if (extra.Length != extraLength) throw new EndOfStreamException();
                  if (reader.ReadBytes(entryCommentLength).Length != entryCommentLength) throw new EndOfStreamException();
                  ValidateExtra(extra);
                  string name = DecodeName(nameBytes, (flags & 0x0800) != 0);
                  bool directory = name.EndsWith("/", StringComparison.Ordinal);
                  ValidatePath(name, directory);
                  if (strictDirect && directory) throw new InvalidDataException("Explicit directory entries are not allowed in a Direct ZIP");
                  if (strictDirect) {
                    if (externalAttributes != 0x81a40000U) throw new InvalidDataException("Direct ZIP external attributes do not match the worker contract");
                  } else {
                    ValidateAttributes(versionMadeBy, externalAttributes, directory);
                  }
                  if (compressedSize > MaxEntryBytes || size > MaxEntryBytes) throw new InvalidDataException("ZIP entry size limit exceeded");
                  declaredTotal = checked(declaredTotal + size);
                  if (declaredTotal > MaxTotalBytes) throw new InvalidDataException("ZIP total uncompressed size limit exceeded");
                  if (size > 1024 * 1024 && (compressedSize == 0 || ((double)size / compressedSize) > MaxCompressionRatio)) {
                    throw new InvalidDataException("ZIP compression ratio limit exceeded");
                  }
                  if (directory && (size != 0 || compressedSize != 0 || crc != 0)) throw new InvalidDataException("ZIP directory payload is invalid");
                  string prefix = rootDirectory + "/";
                  string relative;
                  if (directory && String.Equals(name, prefix, StringComparison.Ordinal)) relative = null;
                  else if (name.StartsWith(prefix, StringComparison.Ordinal) && name.Length > prefix.Length) relative = name.Substring(prefix.Length);
                  else throw new InvalidDataException("ZIP entry is outside the expected root directory");
                  result.Add(new CentralEntry {
                    VersionNeeded = versionNeeded,
                    Flags = flags,
                    Method = method,
                    Crc = crc,
                    CompressedSize = compressedSize,
                    Size = size,
                    Name = name,
                    NameBytes = nameBytes,
                    Directory = directory,
                    LocalOffset = localOffset,
                    Relative = relative
                  });
                }
              }
              if (stream.Position != centralOffset + centralSize || stream.Position != eocdOffset) {
                throw new InvalidDataException("ZIP central directory entry count is invalid");
              }
              return result;
            }

            private static void ValidateLocalLayout(FileStream stream, long centralOffset, List<CentralEntry> metadata, bool strictDirect) {
              List<CentralEntry> ordered = metadata.OrderBy(entry => entry.LocalOffset).ToList();
              long expectedOffset = 0;
              using (BinaryReader reader = new BinaryReader(stream, Encoding.UTF8, true)) {
                foreach (CentralEntry entry in ordered) {
                  if (entry.LocalOffset != expectedOffset || entry.LocalOffset >= centralOffset) throw new InvalidDataException("ZIP local entries are not contiguous");
                  stream.Position = entry.LocalOffset;
                  if (reader.ReadUInt32() != 0x04034b50U) throw new InvalidDataException("ZIP local entry signature is invalid");
                  ushort versionNeeded = reader.ReadUInt16();
                  ushort flags = reader.ReadUInt16();
                  ushort method = reader.ReadUInt16();
                  reader.ReadUInt16(); reader.ReadUInt16();
                  uint crc = reader.ReadUInt32();
                  long compressedSize = reader.ReadUInt32();
                  long size = reader.ReadUInt32();
                  int nameLength = reader.ReadUInt16();
                  int extraLength = reader.ReadUInt16();
                  byte[] name = reader.ReadBytes(nameLength);
                  byte[] extra = reader.ReadBytes(extraLength);
                  if (name.Length != nameLength || extra.Length != extraLength) throw new EndOfStreamException();
                  if (strictDirect && (flags != 0x0800 || extraLength != 0 || nameLength > 1024)) {
                    throw new InvalidDataException("Direct ZIP local flags, extra fields, or path length do not match the worker contract");
                  }
                  if (
