                ushort identifier = ReadUInt16(extra, cursor);
                int length = ReadUInt16(extra, cursor + 2);
                cursor += 4;
                if (cursor + length > extra.Length || !seen.Add(identifier)) throw new InvalidDataException("Malformed or duplicate ZIP extra field");
                if (identifier != 0x5455 || (length != 5 && length != 9 && length != 13)) throw new InvalidDataException("Unsupported ZIP extra field");
                byte flags = extra[cursor];
