            private static void ValidateCollisions(List<CentralEntry> metadata) {
              Dictionary<string, PathNode> nodes = new Dictionary<string, PathNode>(StringComparer.Ordinal);
              foreach (CentralEntry entry in metadata) {
                string trimmed = entry.Name.EndsWith("/", StringComparison.Ordinal) ? entry.Name.Substring(0, entry.Name.Length - 1) : entry.Name;
                string[] segments = trimmed.Split('/');
                List<string> canonical = new List<string>();
                List<string> original = new List<string>();
                for (int index = 0; index < segments.Length; index += 1) {
                  canonical.Add(segments[index].Normalize(NormalizationForm.FormC).ToLowerInvariant());
                  original.Add(segments[index]);
                  string key = String.Join("/", canonical.ToArray());
                  string display = String.Join("/", original.ToArray());
                  bool final = index == segments.Length - 1;
                  bool file = final && !entry.Directory;
                  PathNode existing;
                  if (nodes.TryGetValue(key, out existing)) {
                    if (!String.Equals(existing.Original, display, StringComparison.Ordinal)) throw new InvalidDataException("Case-insensitive or Unicode-normalized ZIP path collision");
                    if (existing.File && (!file || !final)) throw new InvalidDataException("ZIP file and directory hierarchy overlap");
                    if (final && file) throw new InvalidDataException("Duplicate ZIP file path");
                  } else {
                    nodes.Add(key, new PathNode { Original = display, File = file });
                  }
                }
              }
            }

            private static void ValidatePath(string path, bool directory) {
