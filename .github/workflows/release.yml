                } finally { $configPublicRsa.Dispose() }
              } finally { $configDocument.Dispose() }

              $versionDocument = Parse-CapturedJson $directReport "app/version.json" "app/version.json"
              try {
                $versionJson = $versionDocument.RootElement
                Assert-ExactKeys $versionJson @("schemaVersion", "product", "version", "commit", "updaterProtocolVersion") "app/version.json"
                Assert-Int64 (Get-JsonProperty $versionJson "schemaVersion" "app/version.json") 1 "version schemaVersion"
                Assert-Text (Get-JsonProperty $versionJson "product" "app/version.json") "tarkov-helper-web" "version product"
                Assert-Text (Get-JsonProperty $versionJson "version" "app/version.json") $version "version value"
                Assert-Text (Get-JsonProperty $versionJson "commit" "app/version.json") $env:RELEASE_COMMIT "version commit"
                Assert-Int64 (Get-JsonProperty $versionJson "updaterProtocolVersion" "app/version.json") 1 "version updater protocol"
              } finally { $versionDocument.Dispose() }

              $privateRsa = [Security.Cryptography.RSA]::Create()
              try {
                $privatePem = $env:SIGNING_KEY_PEM
                $privateRsa.ImportFromPem($privatePem)
                $privatePem = $null
                $env:SIGNING_KEY_PEM = ""
                Assert-RsaKeyPolicy $privateRsa "Update signing private key"
                $privatePublicDer = $privateRsa.ExportSubjectPublicKeyInfo()
                if (-not [Convert]::ToBase64String($privatePublicDer).Equals([Convert]::ToBase64String($publicDer), [StringComparison]::Ordinal)) {
                  throw "Update signing private and public keys do not match"
                }
                $signature = $privateRsa.SignData($manifestBytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
                if (-not $publicRsa.VerifyData($manifestBytes, $signature, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
                  throw "Generated manifest signature did not verify"
                }
                [IO.File]::WriteAllBytes((Join-Path $assetRoot $signatureName), $signature)
              } finally {
                $env:SIGNING_KEY_PEM = ""
                $privateRsa.Dispose()
              }
            } finally { $publicRsa.Dispose() }
          } finally { $manifestDocument.Dispose() }

          $sumNames = [string[]]@($directName, $staticName, $sourceName, $manifestName, $signatureName)
          [Array]::Sort($sumNames, [StringComparer]::Ordinal)
          $sumLines = [System.Collections.Generic.List[string]]::new()
          foreach ($name in $sumNames) {
            $file = Get-Item -LiteralPath (Join-Path $assetRoot $name)
            $sumLines.Add("$(Get-Sha256Hex $file.FullName)  $($file.Length)  $name")
          }
          $sumText = [string]::Join("`n", $sumLines) + "`n"
          [IO.File]::WriteAllText((Join-Path $assetRoot "SHA256SUMS.txt"), $sumText, [Text.UTF8Encoding]::new($false))
          if (@(Get-ChildItem -LiteralPath $assetRoot -Force).Count -ne 6) { throw "Signed release file set mismatch" }

      - name: Transfer signed assets to the keyless publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    name: Verify, attest, and publish without signing key
    needs: sign
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js without installing project dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Download signed release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-signed-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Revalidate signed bundle against the current draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          git fetch --no-tags origin $env:RELEASE_DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch" }
          git merge-base --is-ancestor $env:RELEASE_COMMIT "refs/remotes/origin/$env:RELEASE_DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not on the repository default branch" }
          $tagCommit = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not [string]::Equals($tagCommit.Trim(), $env:RELEASE_COMMIT, [System.StringComparison]::Ordinal)) {
            throw "Remote tag changed before signed bundle verification"
          }
          $bundleRoot = Join-Path $env:RUNNER_TEMP "release-assets"
          $manifest = Get-Content -LiteralPath (Join-Path $bundleRoot "update-manifest-v1.json") -Raw | ConvertFrom-Json
          $expectedReleaseId = [int64]$manifest.releaseId
          if ($expectedReleaseId -le 0 -or $expectedReleaseId -gt 9007199254740991) { throw "Signed manifest release ID is invalid" }
          $release = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$expectedReleaseId" | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 -or [int64]$release.id -ne $expectedReleaseId -or -not $release.draft -or $release.prerelease -or
            -not [string]::Equals([string]$release.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
          ) { throw "Unable to resolve the verified draft" }
          function Get-AssetId([string]$name) {
            $matches = @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
            if ($matches.Count -ne 1) { throw "Draft asset identity mismatch for $name" }
            return [int64]$matches[0].id
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $directId = Get-AssetId "tarkov-helper-web-direct-v$version.zip"
          $staticId = Get-AssetId "tarkov-helper-web-static-v$version.zip"
          $sourceId = Get-AssetId "tarkov-helper-web-source-v$version.zip"
          node scripts/verify-release-bundle.mjs --bundle $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $expectedReleaseId --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId
          if ($LASTEXITCODE -ne 0) { throw "Signed manifest is not bound to the current GitHub release and asset IDs" }

      - name: Attest every finalized release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Upload metadata, rebind IDs, and publish the pinned draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP "release-assets"
          $version = $env:RELEASE_TAG.Substring(1)
          $expectedFiles = @(Get-ChildItem -LiteralPath $bundleRoot -File | Sort-Object Name)
          $manifest = Get-Content -LiteralPath (Join-Path $bundleRoot "update-manifest-v1.json") -Raw | ConvertFrom-Json
          $expectedReleaseId = [int64]$manifest.releaseId
          if ($expectedReleaseId -le 0 -or $expectedReleaseId -gt 9007199254740991) { throw "Signed manifest release ID is invalid" }
          $expectedAssetNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          @(
            "tarkov-helper-web-direct-v$version.zip",
            "tarkov-helper-web-static-v$version.zip",
            "tarkov-helper-web-source-v$version.zip",
            "update-manifest-v1.json",
            "update-manifest-v1.sig",
            "SHA256SUMS.txt"
          ) | ForEach-Object { [void]$expectedAssetNames.Add($_) }
          if ($expectedFiles.Count -ne 6 -or @($expectedFiles | Where-Object { -not $expectedAssetNames.Contains($_.Name) }).Count -ne 0) {
            throw "Signed publisher input file set mismatch"
          }
          function Get-ExactAsset([object]$release, [string]$name) {
            return @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
          }
          function Upload-Asset([System.IO.FileInfo]$file) {
            gh release upload $env:RELEASE_TAG $file.FullName --repo $env:RELEASE_REPOSITORY | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $($file.Name)" }
          }
          function Assert-ExactAssetSet([object]$release, [string]$label) {
            if (@($release.assets).Count -ne $expectedAssetNames.Count) { throw "$label contains an unexpected asset count" }
            foreach ($asset in @($release.assets)) {
              if (-not $expectedAssetNames.Contains([string]$asset.name)) { throw "$label contains an unexpected asset: $($asset.name)" }
            }
            foreach ($name in $expectedAssetNames) {
              if (@(Get-ExactAsset $release $name).Count -ne 1) { throw "$label asset identity mismatch for $name" }
            }
          }
          function Read-Draft() {
            $value = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$expectedReleaseId" | ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or -not $value.draft -or $value.prerelease -or
              [int64]$value.id -ne $expectedReleaseId -or
              -not [string]::Equals([string]$value.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
            ) { throw "Unable to read the exact draft release" }
            return $value
          }
          $release = Read-Draft
          $missingMetadata = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $expectedFiles | Where-Object Extension -cne ".zip") {
            $matches = @(Get-ExactAsset $release $file.Name)
            if ($matches.Count -gt 1) { throw "Duplicate signed metadata asset: $($file.Name)" }
            if ($matches.Count -eq 0) { $missingMetadata.Add($file.FullName); continue }
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$matches[0].size -ne $file.Length -or -not [string]::Equals([string]$matches[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Existing signed metadata cannot be safely replaced: $($file.Name)"
            }
          }
          if ($missingMetadata.Count -ne 0) {
            foreach ($metadataPath in $missingMetadata) {
              Upload-Asset ([System.IO.FileInfo]::new($metadataPath))
            }
          }
          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            $release = Read-Draft
            $ready = $true
            foreach ($file in $expectedFiles) {
              $matches = @(Get-ExactAsset $release $file.Name)
              if ($matches.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$matches[0].digest)) { $ready = $false; break }
            }
            if ($ready) { break }
            if ($attempt -eq 6) { throw "GitHub did not report all release asset digests within the bounded wait" }
            Start-Sleep -Seconds 2
          }
          Assert-ExactAssetSet $release "Uploaded release"
          foreach ($file in $expectedFiles) {
            $matches = @(Get-ExactAsset $release $file.Name)
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$matches[0].size -ne $file.Length -or -not [string]::Equals([string]$matches[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Uploaded asset identity, size, or digest mismatch for $($file.Name)"
            }
          }
          $directId = [int64](Get-ExactAsset $release "tarkov-helper-web-direct-v$version.zip")[0].id
          $staticId = [int64](Get-ExactAsset $release "tarkov-helper-web-static-v$version.zip")[0].id
          $sourceId = [int64](Get-ExactAsset $release "tarkov-helper-web-source-v$version.zip")[0].id
          node scripts/verify-release-bundle.mjs --bundle $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $release.id --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId
          if ($LASTEXITCODE -ne 0) { throw "Signed manifest is not bound to the current GitHub release and asset IDs" }
          $tagCommit = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not [string]::Equals($tagCommit.Trim(), $env:RELEASE_COMMIT, [System.StringComparison]::Ordinal)) {
            throw "Remote tag changed before publication"
          }
          $candidate = [System.Version]::Parse($version)
          $publishedReleases = @(gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp "repos/$env:RELEASE_REPOSITORY/releases?per_page=100" | ConvertFrom-Json | ForEach-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect existing stable releases" }
          foreach ($item in $publishedReleases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' }) {
            if ([System.Version]::Parse($item.tag_name.Substring(1)) -ge $candidate) {
              throw "A stable release with an equal or newer version already exists"
            }
          }
          $release = Read-Draft
          Assert-ExactAssetSet $release "Pre-publication draft"
          foreach ($file in $expectedFiles) {
            $asset = @(Get-ExactAsset $release $file.Name)
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$asset[0].size -ne $file.Length -or -not [string]::Equals([string]$asset[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Pre-publication asset digest mismatch for $($file.Name)"
            }
          }
          $releaseId = $expectedReleaseId
          gh api --method PATCH -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" -F draft=false -f make_latest=legacy | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; the verified draft was retained"
          }
          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            $published = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to read the published release by pinned ID" }
            $publishedReady = (
              [int64]$published.id -eq $expectedReleaseId -and
              -not $published.draft -and -not $published.prerelease -and $published.immutable -eq $true -and
              [string]::Equals([string]$published.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal) -and
              @($published.assets).Count -eq $expectedAssetNames.Count -and
              @($published.assets | Where-Object { -not $expectedAssetNames.Contains([string]$_.name) }).Count -eq 0
            )
            if ($publishedReady) {
              foreach ($file in $expectedFiles) {
                $asset = @(Get-ExactAsset $published $file.Name)
                if ($asset.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$asset[0].digest)) { $publishedReady = $false; break }
              }
            }
            if ($publishedReady) { break }
            if ($attempt -eq 6) { throw "Published release did not become immutable within the bounded wait" }
            Start-Sleep -Seconds 2
          }
          if (
            [int64]$published.id -ne $expectedReleaseId -or $published.draft -or $published.prerelease -or
            $published.immutable -ne $true -or
            -not [string]::Equals([string]$published.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
          ) {
            throw "Published release did not retain its exact immutable identity"
          }
          Assert-ExactAssetSet $published "Published immutable release"
          foreach ($file in $expectedFiles) {
            $asset = @(Get-ExactAsset $published $file.Name)
            if ($asset.Count -ne 1) { throw "Published asset identity mismatch for $($file.Name)" }
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$asset[0].size -ne $file.Length -or -not [string]::Equals([string]$asset[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Published asset digest mismatch for $($file.Name)"
            }
          }
          if (
            [int64](Get-ExactAsset $published "tarkov-helper-web-direct-v$version.zip")[0].id -ne $directId -or
            [int64](Get-ExactAsset $published "tarkov-helper-web-static-v$version.zip")[0].id -ne $staticId -or
            [int64](Get-ExactAsset $published "tarkov-helper-web-source-v$version.zip")[0].id -ne $sourceId
          ) {
            throw "Published ZIP asset IDs changed after manifest signing"
          }
          $latestReady = $false
          for ($latestAttempt = 1; $latestAttempt -le 6; $latestAttempt += 1) {
            $latestJson = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/latest" 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$latestJson)) {
              $latest = $latestJson | ConvertFrom-Json
              $latestReady = (
                -not $latest.draft -and -not $latest.prerelease -and
                $latest.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' -and
                [System.Version]::Parse($latest.tag_name.Substring(1)) -ge $candidate
              )
            }
            if ($latestReady) { break }
            if ($latestAttempt -eq 6) { throw "Latest stable release did not become readable within the bounded wait" }
            Start-Sleep -Seconds 2
          }
