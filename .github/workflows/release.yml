              List<IsolatedZipRecord> expected = new List<IsolatedZipRecord>();
              string previous = null;
              Regex linePattern = new Regex(@"^([0-9a-f]{64}) {2}(0|[1-9]\d*) {2}(.+)$", RegexOptions.CultureInvariant);
              foreach (string line in lines) {
                Match match = linePattern.Match(line);
                if (!match.Success) throw new InvalidDataException("Malformed Direct SHA256SUMS.txt line");
