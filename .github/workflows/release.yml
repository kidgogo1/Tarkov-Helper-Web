              return utf8 ? StrictUtf8.GetString(bytes) : Encoding.ASCII.GetString(bytes);
            }

            private static uint UpdateCrc(uint crc, byte[] bytes, int length) {
              for (int index = 0; index < length; index += 1) crc = (crc >> 8) ^ CrcTable[(crc ^ bytes[index]) & 0xff];
              return crc;
            }

            private static uint[] CreateCrcTable() {
              uint[] table = new uint[256];
              for (uint index = 0; index < table.Length; index += 1) {
                uint value = index;
                for (int bit = 0; bit < 8; bit += 1) value = (value >> 1) ^ ((value & 1) != 0 ? 0xedb88320U : 0U);
                table[index] = value;
              }
              return table;
            }

            private static string Hex(byte[] bytes) {
              StringBuilder result = new StringBuilder(bytes.Length * 2);
              foreach (byte value in bytes) result.Append(value.ToString("x2", CultureInfo.InvariantCulture));
              return result.ToString();
            }

            private static void ReadFully(Stream stream, byte[] buffer, int offset, int count) {
              while (count > 0) {
                int read = stream.Read(buffer, offset, count);
                if (read == 0) throw new EndOfStreamException();
                offset += read;
                count -= read;
              }
            }

            private static ushort ReadUInt16(byte[] bytes, int offset) {
              return (ushort)(bytes[offset] | (bytes[offset + 1] << 8));
            }

            private static uint ReadUInt32(byte[] bytes, int offset) {
              return (uint)(bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24));
            }
