              if (-not [string]::Equals([string]$remoteCommit.sha, $env:RELEASE_COMMIT, [StringComparison]::Ordinal)) { throw "Remote tag commit mismatch" }
              $createdAtText = (Get-JsonProperty $manifest "createdAt" "Update manifest").GetString()
              $createdAt = [DateTimeOffset]::Parse($createdAtText, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
              $commitAt = [DateTimeOffset]::Parse([string]$remoteCommit.commit.committer.date, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
              if ($createdAt.ToUniversalTime().Ticks -ne $commitAt.ToUniversalTime().Ticks) { throw "Manifest commit timestamp mismatch" }

              $artifacts = Get-JsonProperty $manifest "artifacts" "Update manifest"
              Assert-ExactKeys $artifacts @("direct", "static", "source") "Update manifest artifacts"
              function Assert-Artifact([string]$Kind, [string]$Filename, [string]$RootDirectory, [string[]]$Keys, [object]$ZipReport) {
                $artifact = Get-JsonProperty $artifacts $Kind "Update manifest artifacts"
                Assert-ExactKeys $artifact $Keys "$Kind artifact"
                Assert-Text (Get-JsonProperty $artifact "filename" "$Kind artifact") $Filename "$Kind filename"
                Assert-Text (Get-JsonProperty $artifact "format" "$Kind artifact") "zip" "$Kind format"
                Assert-Text (Get-JsonProperty $artifact "rootDirectory" "$Kind artifact") $RootDirectory "$Kind rootDirectory"
                Assert-Int64 (Get-JsonProperty $artifact "stripComponents" "$Kind artifact") 1 "$Kind stripComponents"
                $file = Get-Item -LiteralPath (Join-Path $assetRoot $Filename)
                if ($file.Length -le 0 -or $file.Length -gt 134217728) { throw "$Kind archive size limit exceeded" }
                Assert-Int64 (Get-JsonProperty $artifact "bytes" "$Kind artifact") $file.Length "$Kind bytes"
                $fileHash = Get-Sha256Hex $file.FullName
                Assert-Text (Get-JsonProperty $artifact "sha256" "$Kind artifact") $fileHash "$Kind sha256"
                $assetIdElement = Get-JsonProperty $artifact "assetId" "$Kind artifact"
                Assert-PositiveInt64 $assetIdElement "$Kind assetId"
                $assetId = $assetIdElement.GetInt64()
                $matches = @($release.assets | Where-Object { [string]::Equals([string]$_.name, $Filename, [StringComparison]::Ordinal) })
                if ($matches.Count -ne 1 -or [int64]$matches[0].id -ne $assetId -or [int64]$matches[0].size -ne $file.Length) { throw "$Kind GitHub asset identity mismatch" }
                if (-not [string]::Equals([string]$matches[0].state, "uploaded", [StringComparison]::Ordinal)) { throw "$Kind GitHub asset is not uploaded" }
                if (-not [string]::Equals([string]$matches[0].digest, "sha256:$fileHash", [StringComparison]::Ordinal)) { throw "$Kind GitHub asset digest mismatch" }
                $unpacked = Get-JsonProperty $artifact "unpacked" "$Kind artifact"
                Assert-ExactKeys $unpacked @("fileCount", "bytes", "treeSha256") "$Kind unpacked metadata"
                if ($ZipReport.FileCount -lt 1 -or $ZipReport.FileCount -gt 10000 -or $ZipReport.Bytes -lt 1 -or $ZipReport.Bytes -gt 268435456) {
                  throw "$Kind ZIP report exceeds client unpacked bounds"
                }
                Assert-Int64 (Get-JsonProperty $unpacked "fileCount" "$Kind unpacked metadata") $ZipReport.FileCount "$Kind unpacked fileCount"
                Assert-Int64 (Get-JsonProperty $unpacked "bytes" "$Kind unpacked metadata") $ZipReport.Bytes "$Kind unpacked bytes"
                Assert-Text (Get-JsonProperty $unpacked "treeSha256" "$Kind unpacked metadata") $ZipReport.TreeSha256 "$Kind unpacked tree hash"
                return $artifact
              }
              $directRootElement = Get-JsonProperty (Get-JsonProperty $artifacts "direct" "Update manifest artifacts") "rootDirectory" "direct artifact"
              if ($directRootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::String) { throw "Direct root directory must be text" }
              $directRoot = $directRootElement.GetString()
              if (
                $directRoot.Length -gt 120 -or
                -not $directRoot.StartsWith("Tarkov Helper ", [StringComparison]::Ordinal) -or
                -not $directRoot.EndsWith(" v$version", [StringComparison]::Ordinal) -or
                $directRoot.IndexOfAny([char[]]@('/', '\', ':')) -ge 0 -or
                $directRoot -match '[\x00-\x1f]'
              ) { throw "Direct root directory is unsafe or does not match the release version" }
              $staticRoot = "tarkov-helper-web-static-v$version"
              $sourceRoot = "tarkov-helper-web-source-v$version"
              $directPath = Join-Path $assetRoot $directName
              $directReport = [IsolatedZipValidator]::Validate(
                $directPath,
                $directRoot,
                [string[]]@("SHA256SUMS.txt", "PACKAGE_INFO.txt", "app/version.json", "UPDATE_CONFIG.json"),
                $true
              )
              $staticReport = [IsolatedZipValidator]::Validate((Join-Path $assetRoot $staticName), $staticRoot, [string[]]@(), $false)
              $sourceReport = [IsolatedZipValidator]::Validate((Join-Path $assetRoot $sourceName), $sourceRoot, [string[]]@(), $false)
              if (-not [string]::Equals($directReport.Comment, "", [StringComparison]::Ordinal)) { throw "Direct ZIP comment must be empty" }
              if (-not [string]::Equals($staticReport.Comment, "", [StringComparison]::Ordinal)) { throw "Static ZIP comment must be empty" }
              if (-not [string]::Equals($sourceReport.Comment.Trim(), $env:RELEASE_COMMIT, [StringComparison]::Ordinal)) { throw "Source ZIP commit provenance mismatch" }

              $directArtifact = Assert-Artifact "direct" $directName $directRoot @("assetId", "filename", "format", "bytes", "sha256", "rootDirectory", "stripComponents", "unpacked", "package") $directReport
              [void](Assert-Artifact "static" $staticName $staticRoot @("assetId", "filename", "format", "bytes", "sha256", "rootDirectory", "stripComponents", "unpacked") $staticReport)
              $sourceArtifact = Assert-Artifact "source" $sourceName $sourceRoot @("assetId", "filename", "format", "bytes", "sha256", "rootDirectory", "stripComponents", "unpacked", "commit") $sourceReport
              Assert-Text (Get-JsonProperty $sourceArtifact "commit" "source artifact") $env:RELEASE_COMMIT "source commit"
              $package = Get-JsonProperty $directArtifact "package" "direct artifact"
              Assert-ExactKeys $package @("version", "sourceCommit", "updaterProtocolVersion", "appFiles", "appBytes", "appTreeSha256") "Direct package metadata"
              Assert-Text (Get-JsonProperty $package "version" "Direct package metadata") $version "package version"
              Assert-Text (Get-JsonProperty $package "sourceCommit" "Direct package metadata") $env:RELEASE_COMMIT "package commit"
              Assert-Int64 (Get-JsonProperty $package "updaterProtocolVersion" "Direct package metadata") 1 "package updater protocol"
              Assert-Int64 (Get-JsonProperty $package "appFiles" "Direct package metadata") $directReport.AppFileCount "package appFiles"
              Assert-Int64 (Get-JsonProperty $package "appBytes" "Direct package metadata") $directReport.AppBytes "package appBytes"
              Assert-Text (Get-JsonProperty $package "appTreeSha256" "Direct package metadata") $directReport.AppTreeSha256 "package app tree hash"

              $packageInfoText = Get-CapturedText $directReport "PACKAGE_INFO.txt" "PACKAGE_INFO.txt"
              if (-not [string]::Equals((Get-PackageValue $packageInfoText "Version" '(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)'), $version, [StringComparison]::Ordinal)) { throw "PACKAGE_INFO version mismatch" }
              if (-not [string]::Equals((Get-PackageValue $packageInfoText "Source commit" '[0-9a-f]{40}'), $env:RELEASE_COMMIT, [StringComparison]::Ordinal)) { throw "PACKAGE_INFO commit mismatch" }
              if ([int64](Get-PackageValue $packageInfoText "Updater protocol" '[1-9]\d*') -ne 1) { throw "PACKAGE_INFO updater protocol mismatch" }
              if ([int64](Get-PackageValue $packageInfoText "App files" '0|[1-9]\d*') -ne $directReport.AppFileCount) { throw "PACKAGE_INFO app file count mismatch" }
              if ([int64](Get-PackageValue $packageInfoText "App bytes" '0|[1-9]\d*') -ne $directReport.AppBytes) { throw "PACKAGE_INFO app byte count mismatch" }
              if (-not [string]::Equals((Get-PackageValue $packageInfoText "App tree SHA-256" '[0-9a-f]{64}'), $directReport.AppTreeSha256, [StringComparison]::Ordinal)) { throw "PACKAGE_INFO app tree hash mismatch" }

              $configDocument = Parse-CapturedJson $directReport "UPDATE_CONFIG.json" "UPDATE_CONFIG.json"
              try {
                $updateConfig = $configDocument.RootElement
                Assert-ExactKeys $updateConfig @("schemaVersion", "updaterEnabled", "protocolVersion", "repository", "releaseApi", "manifestAsset", "signatureAsset", "requireImmutableRelease", "signing") "UPDATE_CONFIG.json"
                Assert-Int64 (Get-JsonProperty $updateConfig "schemaVersion" "UPDATE_CONFIG.json") 1 "config schemaVersion"
                Assert-True (Get-JsonProperty $updateConfig "updaterEnabled" "UPDATE_CONFIG.json") "config updaterEnabled"
                Assert-Int64 (Get-JsonProperty $updateConfig "protocolVersion" "UPDATE_CONFIG.json") 1 "config protocolVersion"
                Assert-Text (Get-JsonProperty $updateConfig "repository" "UPDATE_CONFIG.json") $env:RELEASE_REPOSITORY "config repository"
                Assert-Text (Get-JsonProperty $updateConfig "releaseApi" "UPDATE_CONFIG.json") "$apiRoot/releases/latest" "config releaseApi"
                Assert-Text (Get-JsonProperty $updateConfig "manifestAsset" "UPDATE_CONFIG.json") $manifestName "config manifestAsset"
                Assert-Text (Get-JsonProperty $updateConfig "signatureAsset" "UPDATE_CONFIG.json") $signatureName "config signatureAsset"
                Assert-True (Get-JsonProperty $updateConfig "requireImmutableRelease" "UPDATE_CONFIG.json") "config immutable policy"
                $configSigning = Get-JsonProperty $updateConfig "signing" "UPDATE_CONFIG.json"
                Assert-ExactKeys $configSigning @("algorithm", "keyId", "publicKeySpkiPem") "UPDATE_CONFIG signing"
                Assert-Text (Get-JsonProperty $configSigning "algorithm" "UPDATE_CONFIG signing") "RSA-SHA256" "config signing algorithm"
                Assert-Text (Get-JsonProperty $configSigning "keyId" "UPDATE_CONFIG signing") $keyId "config signing keyId"
                $configPublicRsa = [Security.Cryptography.RSA]::Create()
                try {
                  $configPublicRsa.ImportFromPem((Get-JsonProperty $configSigning "publicKeySpkiPem" "UPDATE_CONFIG signing").GetString())
                  $configPublicDer = $configPublicRsa.ExportSubjectPublicKeyInfo()
                  if (-not [Convert]::ToBase64String($configPublicDer).Equals([Convert]::ToBase64String($publicDer), [StringComparison]::Ordinal)) {
                    throw "Direct package public trust root mismatch"
                  }
                } finally { $configPublicRsa.Dispose() }
              } finally { $configDocument.Dispose() }

              $versionDocument = Parse-CapturedJson $directReport "app/version.json" "app/version.json"
              try {
                $versionJson = $versionDocument.RootElement
                Assert-ExactKeys $versionJson @("schemaVersion", "product", "version", "commit", "updaterProtocolVersion") "app/version.json"
                Assert-Int64 (Get-JsonProperty $versionJson "schemaVersion" "app/version.json") 1 "version schemaVersion"
                Assert-Text (Get-JsonProperty $versionJson "product" "app/version.json") "tarkov-helper-web" "version product"
                Assert-Text (Get-JsonProperty $versionJson "version" "app/version.json") $version "version value"
                Assert-Text (Get-JsonProperty $versionJson "commit" "app/version.json") $env:RELEASE_COMMIT "version commit"
                Assert-Int64 (Get-JsonProperty $versionJson "updaterProtocolVersion" "app/version.json") 1 "version updater protocol"
              } finally { $versionDocument.Dispose() }

              $privateRsa = [Security.Cryptography.RSA]::Create()
              try {
                $privatePem = $env:SIGNING_KEY_PEM
                $privateRsa.ImportFromPem($privatePem)
                $privatePem = $null
                $env:SIGNING_KEY_PEM = ""
                if ($privateRsa.KeySize -lt 3072) { throw "Update signing RSA key must be at least 3072 bits" }
                $privatePublicDer = $privateRsa.ExportSubjectPublicKeyInfo()
                if (-not [Convert]::ToBase64String($privatePublicDer).Equals([Convert]::ToBase64String($publicDer), [StringComparison]::Ordinal)) {
                  throw "Update signing private and public keys do not match"
                }
                $signature = $privateRsa.SignData($manifestBytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
                if (-not $publicRsa.VerifyData($manifestBytes, $signature, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
                  throw "Generated manifest signature did not verify"
                }
                [IO.File]::WriteAllBytes((Join-Path $assetRoot $signatureName), $signature)
              } finally {
                $env:SIGNING_KEY_PEM = ""
                $privateRsa.Dispose()
              }
            } finally { $publicRsa.Dispose() }
          } finally { $manifestDocument.Dispose() }

          $sumNames = [string[]]@($directName, $staticName, $sourceName, $manifestName, $signatureName)
          [Array]::Sort($sumNames, [StringComparer]::Ordinal)
          $sumLines = [System.Collections.Generic.List[string]]::new()
          foreach ($name in $sumNames) {
            $file = Get-Item -LiteralPath (Join-Path $assetRoot $name)
            $sumLines.Add("$(Get-Sha256Hex $file.FullName)  $($file.Length)  $name")
          }
          $sumText = [string]::Join("`n", $sumLines) + "`n"
          [IO.File]::WriteAllText((Join-Path $assetRoot "SHA256SUMS.txt"), $sumText, [Text.UTF8Encoding]::new($false))
          if (@(Get-ChildItem -LiteralPath $assetRoot -Force).Count -ne 6) { throw "Signed release file set mismatch" }

      - name: Transfer signed assets to the keyless publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    name: Verify, attest, and publish without signing key
    needs: sign
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged revision without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js without installing project dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2

      - name: Download signed release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-signed-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Revalidate signed bundle against the current draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          git fetch --no-tags origin $env:RELEASE_DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch" }
          git merge-base --is-ancestor $env:RELEASE_COMMIT "refs/remotes/origin/$env:RELEASE_DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not on the repository default branch" }
          $tagCommit = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not [string]::Equals($tagCommit.Trim(), $env:RELEASE_COMMIT, [System.StringComparison]::Ordinal)) {
            throw "Remote tag changed before signed bundle verification"
          }
          $release = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft -or $release.prerelease) { throw "Unable to resolve the verified draft" }
          function Get-AssetId([string]$name) {
            $matches = @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
            if ($matches.Count -ne 1) { throw "Draft asset identity mismatch for $name" }
            return [int64]$matches[0].id
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $directId = Get-AssetId "tarkov-helper-web-direct-v$version.zip"
          $staticId = Get-AssetId "tarkov-helper-web-static-v$version.zip"
          $sourceId = Get-AssetId "tarkov-helper-web-source-v$version.zip"
          $bundleRoot = Join-Path $env:RUNNER_TEMP "release-assets"
          node scripts/verify-release-bundle.mjs --bundle $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $release.id --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId
          if ($LASTEXITCODE -ne 0) { throw "Signed manifest is not bound to the current GitHub release and asset IDs" }

      - name: Attest every finalized release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Upload metadata, rebind IDs, and publish the pinned draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP "release-assets"
          $version = $env:RELEASE_TAG.Substring(1)
          $expectedFiles = @(Get-ChildItem -LiteralPath $bundleRoot -File | Sort-Object Name)
          $manifest = Get-Content -LiteralPath (Join-Path $bundleRoot "update-manifest-v1.json") -Raw | ConvertFrom-Json
          $expectedReleaseId = [int64]$manifest.releaseId
          if ($expectedReleaseId -le 0 -or $expectedReleaseId -gt 9007199254740991) { throw "Signed manifest release ID is invalid" }
          $expectedAssetNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          @(
            "tarkov-helper-web-direct-v$version.zip",
            "tarkov-helper-web-static-v$version.zip",
            "tarkov-helper-web-source-v$version.zip",
            "update-manifest-v1.json",
            "update-manifest-v1.sig",
            "SHA256SUMS.txt"
          ) | ForEach-Object { [void]$expectedAssetNames.Add($_) }
          if ($expectedFiles.Count -ne 6 -or @($expectedFiles | Where-Object { -not $expectedAssetNames.Contains($_.Name) }).Count -ne 0) {
            throw "Signed publisher input file set mismatch"
          }
          function Get-ExactAsset([object]$release, [string]$name) {
            return @($release.assets | Where-Object { [string]::Equals([string]$_.name, $name, [System.StringComparison]::Ordinal) })
          }
          function Assert-ExactAssetSet([object]$release, [string]$label) {
            if (@($release.assets).Count -ne $expectedAssetNames.Count) { throw "$label contains an unexpected asset count" }
            foreach ($asset in @($release.assets)) {
              if (-not $expectedAssetNames.Contains([string]$asset.name)) { throw "$label contains an unexpected asset: $($asset.name)" }
            }
            foreach ($name in $expectedAssetNames) {
              if (@(Get-ExactAsset $release $name).Count -ne 1) { throw "$label asset identity mismatch for $name" }
            }
          }
          function Read-Draft() {
            $value = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or -not $value.draft -or $value.prerelease -or
              [int64]$value.id -ne $expectedReleaseId -or
              -not [string]::Equals([string]$value.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
            ) { throw "Unable to read the exact draft release" }
            return $value
          }
          $release = Read-Draft
          $missingMetadata = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $expectedFiles | Where-Object Extension -cne ".zip") {
            $matches = @(Get-ExactAsset $release $file.Name)
            if ($matches.Count -gt 1) { throw "Duplicate signed metadata asset: $($file.Name)" }
            if ($matches.Count -eq 0) { $missingMetadata.Add($file.FullName); continue }
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$matches[0].size -ne $file.Length -or -not [string]::Equals([string]$matches[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Existing signed metadata cannot be safely replaced: $($file.Name)"
            }
          }
          if ($missingMetadata.Count -ne 0) {
            gh release upload $env:RELEASE_TAG $missingMetadata.ToArray()
            if ($LASTEXITCODE -ne 0) { throw "Signed release metadata upload failed; the draft was retained" }
          }
          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            $release = Read-Draft
            $ready = $true
            foreach ($file in $expectedFiles) {
              $matches = @(Get-ExactAsset $release $file.Name)
              if ($matches.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$matches[0].digest)) { $ready = $false; break }
            }
            if ($ready) { break }
            if ($attempt -eq 6) { throw "GitHub did not report all release asset digests within the bounded wait" }
            Start-Sleep -Seconds 2
          }
          Assert-ExactAssetSet $release "Uploaded release"
          foreach ($file in $expectedFiles) {
            $matches = @(Get-ExactAsset $release $file.Name)
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$matches[0].size -ne $file.Length -or -not [string]::Equals([string]$matches[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Uploaded asset identity, size, or digest mismatch for $($file.Name)"
            }
          }
          $directId = [int64](Get-ExactAsset $release "tarkov-helper-web-direct-v$version.zip")[0].id
          $staticId = [int64](Get-ExactAsset $release "tarkov-helper-web-static-v$version.zip")[0].id
          $sourceId = [int64](Get-ExactAsset $release "tarkov-helper-web-source-v$version.zip")[0].id
          node scripts/verify-release-bundle.mjs --bundle $bundleRoot --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT --repository $env:RELEASE_REPOSITORY --release-id $release.id --direct-asset-id $directId --static-asset-id $staticId --source-asset-id $sourceId
          if ($LASTEXITCODE -ne 0) { throw "Signed manifest is not bound to the current GitHub release and asset IDs" }
          $tagCommit = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not [string]::Equals($tagCommit.Trim(), $env:RELEASE_COMMIT, [System.StringComparison]::Ordinal)) {
            throw "Remote tag changed before publication"
          }
          $candidate = [System.Version]::Parse($version)
          $publishedReleases = @(gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp "repos/$env:RELEASE_REPOSITORY/releases?per_page=100" | ConvertFrom-Json | ForEach-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect existing stable releases" }
          foreach ($item in $publishedReleases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' }) {
            if ([System.Version]::Parse($item.tag_name.Substring(1)) -ge $candidate) {
              throw "A stable release with an equal or newer version already exists"
            }
          }
          $release = Read-Draft
          Assert-ExactAssetSet $release "Pre-publication draft"
          foreach ($file in $expectedFiles) {
            $asset = @(Get-ExactAsset $release $file.Name)
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$asset[0].size -ne $file.Length -or -not [string]::Equals([string]$asset[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Pre-publication asset digest mismatch for $($file.Name)"
            }
          }
          $releaseId = $expectedReleaseId
          gh api --method PATCH -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" -F draft=false -f make_latest=legacy | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; the verified draft was retained"
          }
          for ($attempt = 1; $attempt -le 6; $attempt += 1) {
            $published = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to read the published release by pinned ID" }
            $publishedReady = (
              [int64]$published.id -eq $expectedReleaseId -and
              -not $published.draft -and -not $published.prerelease -and $published.immutable -eq $true -and
              [string]::Equals([string]$published.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal) -and
              @($published.assets).Count -eq $expectedAssetNames.Count -and
              @($published.assets | Where-Object { -not $expectedAssetNames.Contains([string]$_.name) }).Count -eq 0
            )
            if ($publishedReady) {
              foreach ($file in $expectedFiles) {
                $asset = @(Get-ExactAsset $published $file.Name)
                if ($asset.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$asset[0].digest)) { $publishedReady = $false; break }
              }
            }
            if ($publishedReady) { break }
            if ($attempt -eq 6) { throw "Published release did not become immutable within the bounded wait" }
            Start-Sleep -Seconds 2
          }
          if (
            [int64]$published.id -ne $expectedReleaseId -or $published.draft -or $published.prerelease -or
            $published.immutable -ne $true -or
            -not [string]::Equals([string]$published.tag_name, $env:RELEASE_TAG, [System.StringComparison]::Ordinal)
          ) {
            throw "Published release did not retain its exact immutable identity"
          }
          Assert-ExactAssetSet $published "Published immutable release"
          foreach ($file in $expectedFiles) {
            $asset = @(Get-ExactAsset $published $file.Name)
            if ($asset.Count -ne 1) { throw "Published asset identity mismatch for $($file.Name)" }
            $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ([int64]$asset[0].size -ne $file.Length -or -not [string]::Equals([string]$asset[0].digest, $expectedDigest, [System.StringComparison]::Ordinal)) {
              throw "Published asset digest mismatch for $($file.Name)"
            }
          }
          if (
            [int64](Get-ExactAsset $published "tarkov-helper-web-direct-v$version.zip")[0].id -ne $directId -or
            [int64](Get-ExactAsset $published "tarkov-helper-web-static-v$version.zip")[0].id -ne $staticId -or
            [int64](Get-ExactAsset $published "tarkov-helper-web-source-v$version.zip")[0].id -ne $sourceId
          ) {
            throw "Published ZIP asset IDs changed after manifest signing"
          }
          $latest = gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$env:RELEASE_REPOSITORY/releases/latest" | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 -or $latest.draft -or $latest.prerelease -or
            $latest.tag_name -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or
            [System.Version]::Parse($latest.tag_name.Substring(1)) -lt $candidate
          ) {
            throw "Latest stable release regressed below the published candidate"
          }
